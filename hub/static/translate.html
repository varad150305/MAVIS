<!doctype html>
<html lang="en">
<head>
<script src="/hub/static/device-pref.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Translation · MAVIS</title>
<style>
:root { --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; font:16px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
/* the live camera fills the screen, like the picture of a film */
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
.nocam { position:fixed; inset:0; display:grid; place-items:center; color:#9ca3af; background:#0b0d11; font-size:18px; text-align:center; padding:24px; }
/* subtitles: bottom centre, white with a dark outline, no box; only the current line */
.subs { position:fixed; left:50%; bottom:9vh; transform:translateX(-50%); width:min(88vw, 1300px); text-align:center; pointer-events:none; }
.sub-hi { font-size:clamp(26px, 4.2vw, 52px); font-weight:700; line-height:1.25; color:#fff;
  text-shadow: 0 0 4px #000, 0 0 4px #000, 2px 2px 3px #000, -2px -2px 3px #000, 2px -2px 3px #000, -2px 2px 3px #000; transition: opacity .25s; }
.sub-hi.draft { color:#e5e7eb; font-weight:600; }
.sub-en { font-size:clamp(15px, 1.8vw, 22px); color:#facc15; margin-bottom:8px; text-shadow: 0 0 3px #000, 1px 1px 2px #000, -1px -1px 2px #000; }
.sub-en[hidden], .sub-hi[hidden] { display:none; }
/* small controls on top, out of the picture's way */
.bar { position:fixed; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pill { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:99px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); font-weight:600; font-size:14px; }
.dot { width:9px; height:9px; border-radius:50%; background:#9ca3af; }
.dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
.sp { flex:1; }
button, a.btn { font:600 14px inherit; font-family:inherit; border:0; border-radius:99px; padding:7px 14px; cursor:pointer; background:rgba(0,0,0,.55); color:#fff; text-decoration:none; backdrop-filter:blur(6px); }
button.on { background:#fff; color:#111; }
button:disabled { opacity:.4; cursor:default; }
.err { position:fixed; top:58px; left:12px; right:12px; background:rgba(127,29,29,.85); padding:8px 12px; border-radius:10px; font-size:14px; }
/* transcript drawer (hidden by default) */
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(380px, 92vw); background:rgba(10,12,16,.92); transform:translateX(100%); transition:transform .25s; padding:60px 16px 16px; overflow:auto; }
.drawer.open { transform:none; }
.seg { border-bottom:1px solid rgba(255,255,255,.12); padding:10px 0; }
.seg .e { color:#d1d5db; font-size:14px; } .seg .h { font-size:18px; font-weight:700; margin-top:3px; }
.seg .h.draft { color:#9ca3af; font-weight:500; }
.empty { color:#9ca3af; font-size:14px; }
</style>
<link rel="stylesheet" href="/hub/static/mavis-theme.css">
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div class="nocam" id="nocam">Starting the camera…</div>

<div class="subs"><div class="sub-en" id="subEn" hidden></div><div class="sub-hi" id="subHi" hidden></div></div>

<div class="bar">
  <a class="btn" href="/" target="_top">‹ MAVIS</a>
  <span class="pill" id="state"><span class="dot"></span><span>Connecting…</span></span>
  <span class="pill" id="mic" hidden></span>
  <span class="sp"></span>
  <button id="enBtn" title="Also show the English line">EN</button>
  <button id="logBtn">Transcript</button>
  <button id="startBtn">Start</button>
  <button id="stopBtn" disabled>Stop</button>
</div>
<div class="err" id="err" hidden></div>
<aside class="drawer" id="drawer"><div id="log"><p class="empty" id="empty">The full transcript appears here.</p></div></aside>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const segs = new Map();      // segment_id -> {en, hi, final}
let sessionId = null, lastSeq = 0, lastSeg = null, ws = null, state = 'off', showEn = false, clearT = null;

function setState(s, text) {
  state = s;
  const cls = { ready: 'ok', starting: 'warn', stopping: 'warn', failed: 'bad', error: 'bad', stall: 'warn' }[s] || '';
  $('#state').innerHTML = `<span class="dot ${cls}"></span><span>${text}</span>`;
  const running = ['starting', 'ready', 'stall'].includes(s);
  $('#startBtn').disabled = running || s === 'stopping' || s === 'unavailable';
  $('#stopBtn').disabled = !running;
}
function seg(id) { if (!segs.has(id)) segs.set(id, { en: '', hi: '', final: false }); return segs.get(id); }
function subtitle(s) {
  // Netflix-style: only the current line; the Hindi is the subtitle, the English line is optional
  $('#subHi').hidden = !s.hi; $('#subHi').textContent = s.hi; $('#subHi').className = 'sub-hi' + (s.final ? '' : ' draft');
  $('#subEn').hidden = !(showEn && s.en); $('#subEn').textContent = s.en;
  clearTimeout(clearT);
  if (s.final) clearT = setTimeout(() => { $('#subHi').hidden = true; $('#subEn').hidden = true; }, 7000);
}
function render(id) {
  const s = segs.get(id); if (!s) return;
  $('#empty')?.remove();
  let el = document.getElementById('seg-' + id);
  if (!el) { el = document.createElement('div'); el.className = 'seg'; el.id = 'seg-' + id; el.innerHTML = '<div class="e"></div><div class="h"></div>'; $('#log').appendChild(el); }
  el.querySelector('.e').textContent = s.en;
  const h = el.querySelector('.h'); h.textContent = s.hi; h.className = 'h' + (s.final || !s.hi ? '' : ' draft');
  if (id === lastSeg) subtitle(s);
}
function showErr(t) { $('#err').hidden = !t; $('#err').textContent = t || ''; }

function handle(e) {
  if (e.type === 'bridge') {
    if (e.state === 'microphone') { $('#mic').hidden = false; $('#mic').textContent = '🎙 ' + e.name; }
    if (e.state === 'error') { setState('error', 'Could not start'); showErr(e.error); }
    if (e.state === 'exited' && state !== 'off') setState('off', 'Stopped');
    return;
  }
  if (e.session_id && e.type === 'session_state' && e.state === 'starting' && e.session_id !== sessionId) { sessionId = e.session_id; lastSeq = 0; segs.clear(); }
  if (e.session_id && sessionId && e.session_id !== sessionId) return;      // her contract: drop other sessions
  if (e.seq !== undefined) { if (e.seq <= lastSeq) return; lastSeq = e.seq; }
  switch (e.type) {
    case 'session_state':
      showErr('');
      if (e.state === 'starting') setState('starting', 'Loading translation models… (about 15 s)');
      else if (e.state === 'ready') setState('ready', 'Listening — speak English');
      else if (e.state === 'stopping') setState('stopping', 'Stopping…');
      else if (e.state === 'stopped') setState('off', 'Stopped');
      else if (e.state === 'failed') { setState('failed', 'Failed'); showErr(e.error || 'The translation worker stopped.'); }
      break;
    case 'en_committed': { const s = seg(e.segment_id); s.en = e.stable_text || (s.en + ' ' + (e.new_text || '')).trim(); lastSeg = e.segment_id; render(e.segment_id); break; }
    case 'hi_draft': { const s = seg(e.segment_id); if (!s.final) { s.hi = e.target_text || ''; lastSeg = e.segment_id; render(e.segment_id); } break; }
    case 'hi_final': { const s = seg(e.segment_id); s.hi = e.target_text || s.hi; s.final = true; render(e.segment_id); break; }
    case 'audio_stall': setState('stall', 'No microphone input'); break;
    case 'audio_resumed': setState('ready', 'Listening — speak English'); break;
    case 'mt_error': case 'final_mt_error': case 'error': case 'cleanup_error': showErr((e.where ? e.where + ': ' : '') + (e.error || e.message || 'error')); break;
  }
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/hub/translation/ws');
  ws.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.type === 'hello') {
      if (!e.status.ok) { setState('unavailable', 'Not installed'); showErr(e.status.message); return; }
      setState(['starting', 'ready'].includes(e.status.state) ? e.status.state : 'off', e.status.state === 'ready' ? 'Listening — speak English' : 'Ready to start');
      (e.history || []).forEach(handle);
      if (params.get('autostart') === '1' && !['starting', 'ready'].includes(e.status.state)) start();
      return;
    }
    handle(e);
  };
  ws.onclose = () => { setState('off', 'Disconnected'); setTimeout(connect, 2000); };
}
function start() { showErr(''); ws && ws.readyState === 1 && ws.send(JSON.stringify({ cmd: 'start' })); setState('starting', 'Starting…'); }
$('#startBtn').onclick = start;
$('#stopBtn').onclick = () => { ws.send(JSON.stringify({ cmd: 'stop' })); setState('stopping', 'Stopping…'); };
$('#enBtn').onclick = () => { showEn = !showEn; $('#enBtn').classList.toggle('on', showEn); if (lastSeg != null) subtitle(segs.get(lastSeg)); };
$('#logBtn').onclick = () => { $('#drawer').classList.toggle('open'); $('#logBtn').classList.toggle('on'); };

(async () => {   // the live picture behind the subtitles: this laptop's camera (device-pref.js keeps DroidCam for OCR)
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    $('#cam').srcObject = s; $('#nocam').hidden = true;
  } catch (e) { $('#nocam').textContent = 'No camera picture (' + e.name + '). The subtitles still work.'; }
})();
connect();
</script>
</body>
</html>
