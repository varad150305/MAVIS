[pytest]
testpaths = tests_smoke product/tests
markers =
    models: needs the bundled models and runs the real pipeline (slow)
# Product tests carried over from the research repository that need material
# deliberately NOT packaged (research configs, diagnostic tools, historical
# recordings). They are deselected, not modified:
#   test_phase3_fixes ...window_is_recovered...   -> product.tools.window_replay (diagnostic tool) + saved session
#   test_quality_fixes ...frozen_research_values  -> evaluation/eval_configs/m2_preroll_cpu8.yaml (research config)
#   test_quality_fixes ...recorded_bible_source   -> product.tools.mt_probe (diagnostic tool)
# Three more skip by themselves (historical recordings absent): see _handoff_audit/validation_report.md.
addopts = -p no:cacheprovider
    --deselect product/tests/test_phase3_fixes.py::test_saved_session_window_is_recovered_with_context_and_trimmed_prompt
    --deselect product/tests/test_quality_fixes.py::test_product_config_asr_settings_are_the_frozen_research_values
    --deselect product/tests/test_quality_fixes.py::test_draft_mt_is_deterministic_and_stateless_for_the_recorded_bible_source
